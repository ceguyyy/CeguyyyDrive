# Upstream Backend Load Balancer Cluster
upstream backend_cluster {
    least_conn; # Route traffic to server with fewest active connections
    server backend1:8080 max_fails=3 fail_timeout=10s;
    server backend2:8080 max_fails=3 fail_timeout=10s;
    keepalive 32; # Keep-alive connections to upstream backends
}

# Rate Limiting Zones (Protection against HTTP flood & brute-force)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=3r/s;

# Connection Limiting Zone (Protection against Slowloris & TCP exhaustion)
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

server {
    listen 80;
    server_name localhost;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Payload & Buffer Limits (Prevents memory crash / payload flood attacks)
    client_max_body_size 100M;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # Slowloris Attack Prevention Timeouts
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;

    # Max concurrent connections per client IP
    limit_conn conn_limit 20;
    limit_req_status 429;
    limit_conn_status 429;

    # Block Known Attack Scanners and Malicious Bots
    if ($http_user_agent ~* (sqlmap|nikto|dirbuster|nmap|nessus|havij|acunetix|w3af|zgrab|masscan)) {
        return 403;
    }

    # Health Check Endpoint for Load Balancer Monitoring
    location /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"UP","message":"Nginx Load Balancer is healthy"}';
    }

    # Strict Rate Limit for Authentication Endpoints (Login/Register Brute Force Protection)
    location /v1/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;

        proxy_pass http://backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # API Proxy Routing with Load Balancing & General Rate Limit
    location /v1/ {
        limit_req zone=api_limit burst=30 nodelay;

        proxy_pass http://backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for upload progress & real-time updates
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Serve Frontend Static Assets with React Router (SPA) Fallback
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static Assets Caching (JS, CSS, Images, Fonts)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Custom Error Pages in JSON format
    error_page 429 /429.json;
    location = /429.json {
        default_type application/json;
        return 429 '{"status":"fail","message":"Rate limit exceeded. System is protected against traffic spikes."}';
    }

    error_page 502 503 504 /50x.json;
    location = /50x.json {
        default_type application/json;
        return 503 '{"status":"error","message":"Service temporarily unavailable. Please try again shortly."}';
    }
}
